[project]
name = "puccinialin"
version = "0.1.14"
description = "Install rust into a temporary directory for boostrapping a rust-based build backend"
readme = "README.md"
authors = [
    { name = "konstin", email = "konstin@mailbox.org" }
]
requires-python = ">=3.9"
dependencies = [
    "filelock>=3.19.1,<4.0.0",
    "httpx>=0.28.1,<0.29",
    "platformdirs>=4.3.6,<5",
    "tqdm>=4.67.1,<5",
]
license = "MIT OR Apache-2.0"
license-files = ["license-mit", "license-apache"]

[project.scripts]
puccinialize = "puccinialin.__main__:main"

[project.urls]
repository = "https://github.com/konstin/puccinialin"

[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    "ruff>=0.16.0,<0.17.0",
    "ty>=0.0.64,<1.0.0",
]

[tool.uv]
exclude-newer = "3 days"
# Include the eMudhra trust-store security fix released inside the cooldown.
exclude-newer-package = { certifi = "2026-10-20T02:24:17Z" }
